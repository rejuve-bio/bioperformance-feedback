name: Feature request
description: Suggest something new or different for the BioPerformance app.
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Everything you write here can be seen by anyone. Leave out anything personal, such as health readings, names or contact details.

        You can also send a request with **Send feedback** in the app itself.
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which app is this for?
      options:
        - Mobile
        - Web
        - Both
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like
      description: Describe what you'd like the app to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What would this let you do that you can't do now?
